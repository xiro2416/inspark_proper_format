[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acc-infer-clear-optimized"
version = "0.1.0"
description = "Independent first-packet optimized Universal IndexTTS2 DSpark runtime"
requires-python = ">=3.11,<3.12"
dependencies = ["torch==2.8.0", "torchaudio==2.8.0", "transformers==4.52.1", "huggingface-hub==0.35.0", "openai-whisper==20250625", "tiktoken==0.13.0", "numpy==2.2.6", "PyYAML==6.0.2", "soundfile==0.13.1", "safetensors", "omegaconf", "sentencepiece", "librosa==0.10.2.post1", "einops", "munch", "cn2an", "g2p-en", "jieba", "WeTextProcessing==1.0.4.1", "silero-vad==6.2.1", "descript-audiotools==0.7.2", "json5", "psutil==7.2.2"]

[project.scripts]
acc-clear = "acc_infer_clear.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.txt", "*.cu", "*.md", "LICENSE*"]
